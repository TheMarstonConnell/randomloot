plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // NeoForge's config API (ModConfigSpec + TOML loading) on Fabric.
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/randomloot.accesswidener')
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric GameTest Server')
            runDir('runs/gametest')
            // Fabric API's gametest hook: runs all registered gametests, then exits.
            vmArg '-Dfabric-api.gametest'
        }
    }
}

// The gametest server starts from a config file with one value moved off its default, so
// the configLoads gametest can tell "the file was read into the mod" from "the mod is
// running on its defaults". It replaces the file: runs/gametest is a throwaway run
// directory, and the config API fills the other keys back in with their defaults on load.
def seedGametestConfig = tasks.register('seedGametestConfig') {
    def config = file('runs/gametest/config/randomloot-common.toml')
    doLast {
        config.parentFile.mkdirs()
        config.text = '["Modifier Settings"]\n\tlivingWhispersPerMinute = 7\n'
    }
}
tasks.matching { it.name == 'runGametest' }.configureEach { dependsOn seedGametestConfig }
