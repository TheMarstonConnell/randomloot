name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Push events to matching v*, i.e. v20.15.10
      - "v[0-9]+.[0-9]+.[0-9]+.?[0-9]*" # Push events to matching v*, v20.15.10.1
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+" # Push events to matching alpha releases
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+" # Push events to matching beta releases
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+" # Push events to matching release candidates

permissions:
  contents: write

jobs:
  # One tag releases every maintained Minecraft version at once: each matrix entry
  # checks out its version branch's HEAD, builds + gametests it, and publishes.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # modloader: the Forge-family project in that branch (its Gradle project
          # name, jar-name segment and CurseForge/Modrinth loader id are all the same
          # word). manifest: the file that proves the jar is that loader's.
          # java: the Minecraft version's Java (what the mod platforms list).
          # build_java: the JDK Gradle itself runs on, when it differs from java.
          # fabric-loom needs a newer JDK than Minecraft 1.20.1's Java 17; the
          # Gradle toolchain still compiles that branch for 17.
          - branch: "26.x"
            java: "25"
            modloader: neoforge
            modloader_name: NeoForge
            manifest: META-INF/neoforge.mods.toml
          - branch: "1.21.1.x"
            java: "21"
            modloader: neoforge
            modloader_name: NeoForge
            manifest: META-INF/neoforge.mods.toml
          - branch: "1.20.1.x"
            java: "17"
            build_java: "21"
            modloader: forge
            modloader_name: Forge
            manifest: META-INF/mods.toml

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # The last version listed becomes the default JDK (the one Gradle runs
          # on); the first stays installed for the Gradle toolchain to find.
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.build_java || matrix.java }}
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Get the version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Get the Minecraft version
        id: mc_version
        shell: bash
        run: |
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          # mc-publish resolves this against Mojang's version manifest and normalizes
          # per platform (e.g. CurseForge 26.2.0, Modrinth 26.2), so pass the full
          # gradle version verbatim — no manual major/.0 munging needed.
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing for Minecraft $MC_VERSION"
      - name: Classify release
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          case "$VERSION" in
            *-alpha.*)
              echo "IS_PRE_RELEASE=true" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=alpha" >> "$GITHUB_OUTPUT"
              ;;
            *-beta.*|*-rc.*)
              echo "IS_PRE_RELEASE=true" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "IS_PRE_RELEASE=false" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=release" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Update mod version in gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.get_version.outputs.VERSION }}/" gradle.properties
          echo "Updated mod_version to ${{ steps.get_version.outputs.VERSION }}"
          grep '^mod_version=' gradle.properties
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: Run in-world GameTests (${{ matrix.modloader_name }})
        run: ./gradlew :${{ matrix.modloader }}:runGameTestServer
      - name: Run in-world GameTests (Fabric)
        run: ./gradlew :fabric:runGametest
      - name: Stage and verify mod jars
        shell: bash
        env:
          MODLOADER: ${{ matrix.modloader }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail

          # "-forge-" cannot match a "-neoforge-" jar name (and vice versa): the
          # leading hyphen is part of the pattern.
          mapfile -t MODLOADER_JARS < <(find "$MODLOADER/build/libs" -maxdepth 1 -type f -name "*-${MODLOADER}-*.jar" ! -name '*-sources.jar')
          mapfile -t FABRIC_JARS < <(find fabric/build/libs -maxdepth 1 -type f -name '*-fabric-*.jar' ! -name '*-sources.jar')

          if (( ${#MODLOADER_JARS[@]} != 1 || ${#FABRIC_JARS[@]} != 1 )); then
            echo "::error::Expected exactly one publishable jar for each loader."
            find "$MODLOADER/build/libs" fabric/build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          fi

          MODLOADER_JAR=${MODLOADER_JARS[0]}
          FABRIC_JAR=${FABRIC_JARS[0]}
          jar tf "$MODLOADER_JAR" > /tmp/modloader-jar-contents.txt
          jar tf "$FABRIC_JAR" > /tmp/fabric-jar-contents.txt

          grep -Fqx "$MANIFEST" /tmp/modloader-jar-contents.txt
          grep -Fqx 'dev/marston/randomloot/RandomLoot.class' /tmp/modloader-jar-contents.txt
          grep -Fqx 'fabric.mod.json' /tmp/fabric-jar-contents.txt
          grep -Fqx 'dev/marston/randomloot/RandomLoot.class' /tmp/fabric-jar-contents.txt
          grep -Eq '^META-INF/jars/forgeconfigapiport-fabric-.*\.jar$' /tmp/fabric-jar-contents.txt

          mkdir -p dist
          cp "$MODLOADER_JAR" "$FABRIC_JAR" dist/
          mapfile -t DIST_JARS < <(find dist -maxdepth 1 -type f -name '*.jar')
          if (( ${#DIST_JARS[@]} != 2 )); then
            echo "::error::Expected exactly two staged jars."
            exit 1
          fi
          ls -la dist/

      # Skip CurseForge/Modrinth for a jar whose version-normalized content hash
      # matches the previous release's jar for the same loader + Minecraft version:
      # matching means no changes shipped for that version. Builds are reproducible
      # (build-logic sets reproducible archives) and scripts/modhash.sh blanks the
      # stamped release version before hashing, so identical code hashes identically.
      - name: Compare against previous release
        id: unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VERSION: ${{ steps.mc_version.outputs.MC_VERSION }}
          MODLOADER: ${{ matrix.modloader }}
        run: |
          set -euo pipefail
          PREV_TAG=$(gh release list --exclude-drafts --limit 20 --json tagName --jq '.[].tagName' \
            | grep -v -Fx "${GITHUB_REF#refs/tags/}" | head -1 || true)

          for LOADER in "$MODLOADER" fabric; do
            SKIP=false
            JAR=$(find dist -maxdepth 1 -name "*-${LOADER}-*.jar" | head -1)
            if [ -n "$PREV_TAG" ]; then
              PREV_ASSET=$(gh release view "$PREV_TAG" --json assets \
                --jq ".assets[].name | select(test(\"-${LOADER}-\")) | select(contains(\"${MC_VERSION}\"))" | head -1 || true)
              if [ -n "$PREV_ASSET" ]; then
                gh release download "$PREV_TAG" --pattern "$PREV_ASSET" --output /tmp/prev-${LOADER}.jar
                NEW_HASH=$(./scripts/modhash.sh "$JAR")
                OLD_HASH=$(./scripts/modhash.sh /tmp/prev-${LOADER}.jar)
                echo "${LOADER}: new=$NEW_HASH prev=$OLD_HASH (from $PREV_TAG/$PREV_ASSET)"
                if [ "$NEW_HASH" = "$OLD_HASH" ]; then
                  SKIP=true
                  echo "::notice::${LOADER} ${MC_VERSION} jar is unchanged since ${PREV_TAG}; skipping CurseForge/Modrinth."
                fi
              else
                echo "${LOADER}: no previous ${MC_VERSION} asset on ${PREV_TAG}; publishing."
              fi
            else
              echo "No previous release found; publishing everything."
            fi
            # SKIP_MODLOADER for the Forge-family jar, SKIP_FABRIC for the Fabric one.
            if [ "$LOADER" = fabric ]; then KEY=SKIP_FABRIC; else KEY=SKIP_MODLOADER; fi
            echo "${KEY}=$SKIP" >> "$GITHUB_OUTPUT"
          done

      # Every built jar still lands on the GitHub release (via the release job),
      # unchanged or not — only the mod-platform uploads are skipped.
      - name: Upload jars for the GitHub release
        uses: actions/upload-artifact@v6
        with:
          name: jars-${{ steps.mc_version.outputs.MC_VERSION }}
          path: dist/*.jar

      # One version entry per loader so CurseForge/Modrinth tag them correctly.
      - name: Publish ${{ matrix.modloader_name }} jar to CurseForge & Modrinth
        if: steps.unchanged.outputs.SKIP_MODLOADER != 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: bM2Gf75C
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "301631"
          curseforge-token: ${{ secrets.CURSEFORGE }}
          changelog: "# Change Log\n\nClick [here](https://github.com/TheMarstonConnell/randomloot/releases/tag/v${{ steps.get_version.outputs.VERSION }}) for full list of changes."
          files: dist/*-${{ matrix.modloader }}-*.jar
          name: "Random Loot 2 - ${{ steps.get_version.outputs.VERSION }} (${{ matrix.modloader_name }} ${{ steps.mc_version.outputs.MC_VERSION }})"
          version: "${{ steps.get_version.outputs.VERSION }}+mc${{ steps.mc_version.outputs.MC_VERSION }}-${{ matrix.modloader }}"
          version-type: ${{ steps.release.outputs.RELEASE_TYPE }}
          game-versions: "${{ steps.mc_version.outputs.MC_VERSION }}"
          loaders: ${{ matrix.modloader }}
          java: ${{ matrix.java }}

      - name: Publish Fabric jar to CurseForge & Modrinth
        if: steps.unchanged.outputs.SKIP_FABRIC != 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: bM2Gf75C
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "301631"
          curseforge-token: ${{ secrets.CURSEFORGE }}
          changelog: "# Change Log\n\nClick [here](https://github.com/TheMarstonConnell/randomloot/releases/tag/v${{ steps.get_version.outputs.VERSION }}) for full list of changes."
          files: dist/*-fabric-*.jar
          name: "Random Loot 2 - ${{ steps.get_version.outputs.VERSION }} (Fabric ${{ steps.mc_version.outputs.MC_VERSION }})"
          version: "${{ steps.get_version.outputs.VERSION }}+mc${{ steps.mc_version.outputs.MC_VERSION }}-fabric"
          version-type: ${{ steps.release.outputs.RELEASE_TYPE }}
          game-versions: "${{ steps.mc_version.outputs.MC_VERSION }}"
          loaders: fabric
          java: ${{ matrix.java }}

  # The GitHub release carries every version's jars, created once after all
  # matrix builds pass.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Classify release
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF#refs/tags/}" in
            *-alpha.*|*-beta.*|*-rc.*) echo "IS_PRE_RELEASE=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "IS_PRE_RELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Download all built jars
        uses: actions/download-artifact@v7
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist
      - name: Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.release.outputs.IS_PRE_RELEASE }}
          files: dist/*.jar
