name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Push events to matching v*, i.e. v20.15.10
      - "v[0-9]+.[0-9]+.[0-9]+.?[0-9]*" # Push events to matching v*, v20.15.10.1
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+" # Push events to matching alpha releases
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+" # Push events to matching beta releases
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+" # Push events to matching release candidates

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Get the version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Get the Minecraft version
        id: mc_version
        shell: bash
        run: |
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          # mc-publish resolves this against Mojang's version manifest and normalizes
          # per platform (e.g. CurseForge 26.2.0, Modrinth 26.2), so pass the full
          # gradle version verbatim — no manual major/.0 munging needed.
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing for Minecraft $MC_VERSION"
      - name: Classify release
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          case "$VERSION" in
            *-alpha.*)
              echo "IS_PRE_RELEASE=true" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=alpha" >> "$GITHUB_OUTPUT"
              ;;
            *-beta.*|*-rc.*)
              echo "IS_PRE_RELEASE=true" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "IS_PRE_RELEASE=false" >> "$GITHUB_OUTPUT"
              echo "RELEASE_TYPE=release" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Update mod version in gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.get_version.outputs.VERSION }}/" gradle.properties
          echo "Updated mod_version to ${{ steps.get_version.outputs.VERSION }}"
          grep '^mod_version=' gradle.properties
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: Run in-world GameTests (NeoForge)
        run: ./gradlew :neoforge:runGameTestServer
      - name: Run in-world GameTests (Fabric)
        run: ./gradlew :fabric:runGametest
      - name: Stage and verify mod jars
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t NEOFORGE_JARS < <(find neoforge/build/libs -maxdepth 1 -type f -name '*-neoforge-*.jar' ! -name '*-sources.jar')
          mapfile -t FABRIC_JARS < <(find fabric/build/libs -maxdepth 1 -type f -name '*-fabric-*.jar' ! -name '*-sources.jar')

          if (( ${#NEOFORGE_JARS[@]} != 1 || ${#FABRIC_JARS[@]} != 1 )); then
            echo "::error::Expected exactly one publishable jar for each loader."
            find neoforge/build/libs fabric/build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          fi

          NEOFORGE_JAR=${NEOFORGE_JARS[0]}
          FABRIC_JAR=${FABRIC_JARS[0]}
          jar tf "$NEOFORGE_JAR" > /tmp/neoforge-jar-contents.txt
          jar tf "$FABRIC_JAR" > /tmp/fabric-jar-contents.txt

          grep -Fqx 'META-INF/neoforge.mods.toml' /tmp/neoforge-jar-contents.txt
          grep -Fqx 'dev/marston/randomloot/RandomLoot.class' /tmp/neoforge-jar-contents.txt
          grep -Fqx 'fabric.mod.json' /tmp/fabric-jar-contents.txt
          grep -Fqx 'dev/marston/randomloot/RandomLoot.class' /tmp/fabric-jar-contents.txt
          grep -Eq '^META-INF/jars/forgeconfigapiport-fabric-.*\.jar$' /tmp/fabric-jar-contents.txt

          mkdir -p dist
          cp "$NEOFORGE_JAR" "$FABRIC_JAR" dist/
          mapfile -t DIST_JARS < <(find dist -maxdepth 1 -type f -name '*.jar')
          if (( ${#DIST_JARS[@]} != 2 )); then
            echo "::error::Expected exactly two staged jars."
            exit 1
          fi
          ls -la dist/
      - name: Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.release.outputs.IS_PRE_RELEASE }}
          files: dist/*.jar

      # One version entry per loader so CurseForge/Modrinth tag them correctly.
      - name: Publish NeoForge jar to CurseForge & Modrinth
        id: publish_neoforge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: bM2Gf75C
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "301631"
          curseforge-token: ${{ secrets.CURSEFORGE }}
          changelog: "# Change Log\n\nClick [here](https://github.com/TheMarstonConnell/randomloot/releases/tag/v${{ steps.get_version.outputs.VERSION }}) for full list of changes."
          files: dist/*-neoforge-*.jar
          name: "Random Loot 2 - ${{ steps.get_version.outputs.VERSION }} (NeoForge)"
          version: "${{ steps.get_version.outputs.VERSION }}+neoforge"
          version-type: ${{ steps.release.outputs.RELEASE_TYPE }}
          game-versions: "${{ steps.mc_version.outputs.MC_VERSION }}"
          loaders: neoforge
          java: 25

      - name: Publish Fabric jar to CurseForge & Modrinth
        id: publish_fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: bM2Gf75C
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "301631"
          curseforge-token: ${{ secrets.CURSEFORGE }}
          changelog: "# Change Log\n\nClick [here](https://github.com/TheMarstonConnell/randomloot/releases/tag/v${{ steps.get_version.outputs.VERSION }}) for full list of changes."
          files: dist/*-fabric-*.jar
          name: "Random Loot 2 - ${{ steps.get_version.outputs.VERSION }} (Fabric)"
          version: "${{ steps.get_version.outputs.VERSION }}+fabric"
          version-type: ${{ steps.release.outputs.RELEASE_TYPE }}
          game-versions: "${{ steps.mc_version.outputs.MC_VERSION }}"
          loaders: fabric
          java: 25

      # mc-publish does not currently expose CurseForge's per-file environment
      # metadata, so add it through CurseForge's supported file-update API.
      - name: Mark CurseForge files for client and server
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE }}
          CURSEFORGE_PROJECT_ID: "301631"
          MINECRAFT_VERSION: ${{ steps.mc_version.outputs.MC_VERSION }}
          NEOFORGE_FILES: ${{ steps.publish_neoforge.outputs['curseforge-files'] }}
          FABRIC_FILES: ${{ steps.publish_fabric.outputs['curseforge-files'] }}
        run: |
          set -euo pipefail

          API_ROOT="https://minecraft.curseforge.com/api"
          VERSION_DATA=$(curl --fail-with-body --silent --show-error --retry 2 \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            "$API_ROOT/game/versions?cache=true")

          version_name_exists() {
            jq -e --arg name "$1" \
              '[.[] | select(.name == $name)] | length > 0' \
              <<< "$VERSION_DATA" > /dev/null
          }

          CURSEFORGE_MINECRAFT_VERSION="$MINECRAFT_VERSION"
          if [[ "$MINECRAFT_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && version_name_exists "$MINECRAFT_VERSION.0"; then
            CURSEFORGE_MINECRAFT_VERSION="$MINECRAFT_VERSION.0"
          elif ! version_name_exists "$MINECRAFT_VERSION"; then
            echo "::error::CurseForge does not recognize Minecraft $MINECRAFT_VERSION."
            exit 1
          fi

          for name in Client Server Fabric NeoForge "Java 25"; do
            if ! version_name_exists "$name"; then
              echo "::error::CurseForge does not recognize game-version name '$name'."
              exit 1
            fi
          done

          update_files() {
            local loader=$1
            local files_json=$2
            local -a file_ids
            local file_id metadata
            mapfile -t file_ids < <(jq -r '.[].id' <<< "$files_json")

            if (( ${#file_ids[@]} == 0 )); then
              echo "::error::mc-publish returned no CurseForge file IDs for $loader."
              exit 1
            fi

            for file_id in "${file_ids[@]}"; do
              if [[ ! "$file_id" =~ ^[0-9]+$ ]]; then
                echo "::error::Invalid CurseForge file ID '$file_id' for $loader."
                exit 1
              fi

              metadata=$(jq -cn \
                --argjson file_id "$file_id" \
                --arg minecraft "$CURSEFORGE_MINECRAFT_VERSION" \
                --arg loader "$loader" \
                '{
                  fileID: $file_id,
                  gameVersionNames: ["Client", "Server", $minecraft, $loader, "Java 25"]
                }')

              curl --fail-with-body --silent --show-error --retry 2 \
                -H "X-Api-Token: $CURSEFORGE_TOKEN" \
                -F "metadata=$metadata" \
                "$API_ROOT/projects/$CURSEFORGE_PROJECT_ID/update-file" \
                > "/tmp/curseforge-update-$file_id.json"
              echo "Added Client and Server environments to CurseForge file $file_id ($loader)."
            done
          }

          update_files NeoForge "$NEOFORGE_FILES"
          update_files Fabric "$FABRIC_FILES"
