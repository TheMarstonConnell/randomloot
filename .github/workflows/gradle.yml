# This workflow builds the mod, runs the JUnit unit tests (via the `build` task's
# `check` dependency), and runs the in-world GameTests on a headless GameTestServer.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Gradle Build

on:
  push:
    branches: [ "main", "*.x" ]
  pull_request:
    branches: [ "main", "*.x" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build and run unit tests
      run: ./gradlew build
    - name: Run in-world gametests (NeoForge)
      run: ./gradlew :neoforge:runGameTestServer
    - name: Run in-world gametests (Fabric)
      run: ./gradlew :fabric:runGametest
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          neoforge/build/reports/tests/
          neoforge/run/logs/
          fabric/runs/gametest/logs/
