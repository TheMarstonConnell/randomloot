# This workflow builds the mod, runs the JUnit unit tests (via the `build` task's
# `check` dependency), and runs the in-world GameTests on a headless GameTestServer.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Gradle Build

on:
  push:
    branches: [ "main", "*.x" ]
  pull_request:
    branches: [ "main", "*.x" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # Gradle runs on 21 (fabric-loom needs a newer JDK than Minecraft 1.20.1's Java
    # 17); 17 is installed for the Gradle toolchain that compiles the mod. The last
    # version listed is the default.
    - name: Set up JDK 17 + 21
      uses: actions/setup-java@v5
      with:
        java-version: |
          17
          21
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build and run unit tests
      run: ./gradlew build
    - name: Run in-world gametests (Forge)
      run: ./gradlew :forge:runGameTestServer
    - name: Run in-world gametests (Fabric)
      run: ./gradlew :fabric:runGametest
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          common/build/reports/tests/
          forge/run/logs/
          fabric/runs/gametest/logs/
